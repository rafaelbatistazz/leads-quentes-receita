# Todo dia confere se a Receita publicou o mês novo; se sim e ainda não há release dele, monta e publica.
# Fonte dos scripts: projeto CENTRAL DISPARO (receita/). Aqui ficam cópias para a Action rodar sozinha.
name: base mensal
on:
  schedule: [{ cron: '0 9 * * *' }]
  workflow_dispatch:
    inputs:
      ref: { description: 'Mês AAAA-MM (vazio = o mais novo)', required: false }
      refazer: { description: 'Refazer mesmo se o mês já tiver release', type: boolean, default: false }
permissions: { contents: write }
jobs:
  montar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - uses: actions/checkout@v4
      - name: mês mais novo
        id: ref
        run: |
          REF="${{ inputs.ref }}"
          if [ -z "$REF" ]; then
            REF=$(curl -s -X PROPFIND -H 'Depth: 1' https://arquivos.receitafederal.gov.br/public.php/dav/files/gn672Ad4CF8N6TK/Dados/Cadastros/CNPJ/ \
              | grep -o 'CNPJ/20[0-9][0-9]-[0-9][0-9]/' | sort -u | tail -1 | cut -d/ -f2)
          fi
          echo "mês: $REF"
          if gh release view "$REF" >/dev/null 2>&1 && [ "${{ inputs.refazer }}" != "true" ]; then echo "já publicado"; else echo "ref=$REF" >> "$GITHUB_OUTPUT"; fi
      - name: liberar disco
        if: steps.ref.outputs.ref
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: baixar e filtrar
        if: steps.ref.outputs.ref
        run: bash baixar.sh "$RUNNER_TEMP/rf" "${{ steps.ref.outputs.ref }}"
      - name: montar blocos
        if: steps.ref.outputs.ref
        run: |
          pip install -q duckdb
          python etl.py "$RUNNER_TEMP/rf/csv" "$RUNNER_TEMP/saida" "${{ steps.ref.outputs.ref }}" --cidades cidades.json --db "$RUNNER_TEMP/base.duckdb"
          ls -la "$RUNNER_TEMP/saida" | head -60
      - name: publicar
        if: steps.ref.outputs.ref
        run: |
          REF="${{ steps.ref.outputs.ref }}"
          if gh release view "$REF" >/dev/null 2>&1; then gh release upload "$REF" "$RUNNER_TEMP"/saida/* --clobber; exit 0; fi
          gh release create "$REF" "$RUNNER_TEMP"/saida/* --title "Base CNPJ $REF" --notes "Dados abertos do CNPJ de $REF (Receita Federal), recorte para a extensão Leads Quentes." --latest
